name: Build and push image

# Release on version tags of the form N.N only (1.1, 1.2, 1.35, ...)
on:
  push:
    tags:
      - '[0-9]+.[0-9]+'

# Built-in GITHUB_TOKEN: read the code, push the image to ghcr.io (no PAT or secret needed)
permissions:
  contents: read
  packages: write

jobs:
  # Run the test workflow first; if it fails, nothing is built or pushed
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # QEMU emulates arm64 on the amd64 runner; Buildx builds multiple platforms at once
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Log in to ghcr.io with the built-in token
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercased image name plus two tags: the git tag (e.g. 1.2) and latest
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wikipedia-producer
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      # Build amd64 + arm64 and push them as one multi-arch image
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
